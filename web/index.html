<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fbf7ef" />
<title>涂知 · 出片</title>
<style>
  :root { --paper:#fbf7ef; --ink:#211c17; --muted:#8a7f70; --pop:#e4572e; --blue:#2f7fd6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:"HanziPen SC","Kaiti SC",-apple-system,"PingFang SC",sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding:18px 18px 6px; }
  h1 { margin:0; font-size:24px; }
  .sub { color:var(--muted); font-size:12px; margin-top:2px; font-family:-apple-system,"PingFang SC",sans-serif; }
  .panel { padding:10px 18px; display:grid; gap:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > label { color:var(--muted); font-size:13px; min-width:3em; }
  select, input[type=file] { font:inherit; padding:8px 10px; border:2px solid var(--ink); border-radius:10px; background:#fff; }
  button { font:inherit; padding:10px 16px; border:2px solid var(--ink); border-radius:12px; background:#fff; cursor:pointer; }
  button.primary { background:var(--ink); color:var(--paper); }
  button:disabled { opacity:.5; }
  .seg { display:inline-flex; border:2px solid var(--ink); border-radius:12px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:8px 12px; }
  .seg button.on { background:var(--pop); color:#fff; }
  .stage { display:flex; justify-content:center; padding:6px 12px 12px; }
  canvas { max-width:100%; max-height:52vh; border:2px solid rgba(60,50,40,.3); border-radius:14px; background:#fff; }
  .bar { height:8px; border-radius:99px; background:rgba(60,50,40,.14); overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--pop); transition:width .15s; }
  .status { font-size:13px; color:var(--muted); min-height:1.2em; font-family:-apple-system,"PingFang SC",sans-serif; }
  a.dl { display:none; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>涂知 · 出片</h1>
  <div class="sub">手机端手绘涂鸦科普视频生成 · 逐帧渲染 + FFmpeg.wasm 编码（无旁白时导出纯字幕版，可另附音轨）</div>
</header>

<div class="panel">
  <div class="row">
    <label>主题</label>
    <select id="episode"></select>
  </div>
  <div class="row">
    <label>语言</label>
    <div class="seg" id="lang">
      <button data-val="zh" class="on">中文</button>
      <button data-val="en">English</button>
    </div>
    <label style="margin-left:8px">画幅</label>
    <div class="seg" id="ratio">
      <button data-val="9:16" class="on">竖 9:16</button>
      <button data-val="16:9">横 16:9</button>
    </div>
  </div>
  <div class="row">
    <label>音轨</label>
    <input type="file" id="audio" accept="audio/*" />
    <span class="status" id="audioInfo">可选</span>
  </div>
  <div class="row">
    <button id="play">▶ 预览</button>
    <button id="export" class="primary">导出 MP4</button>
    <span class="status" id="status">就绪</span>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <a class="dl" id="dl">下载视频</a>
</div>

<div class="stage"><canvas id="cv"></canvas></div>

<script type="module" src="./main.ts"></script>
</body>
</html>
